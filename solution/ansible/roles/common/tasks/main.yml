---
- name: Display host context (safe on all connections)
  ansible.builtin.debug:
    msg: >-
      Baseline check for {{ inventory_hostname }}
      site={{ fl_site | default('n/a') }}
      role={{ fl_role | default('n/a') }}
      org={{ fl_org }}

- name: Ensure chrony/NTP config snippet is rendered (demo artifact)
  ansible.builtin.template:
    src: chrony-fl.conf.j2
    dest: /tmp/fl-chrony-{{ inventory_hostname }}.conf
    mode: "0644"

- name: Report intended package set for this host class
  ansible.builtin.debug:
    var: common_packages
