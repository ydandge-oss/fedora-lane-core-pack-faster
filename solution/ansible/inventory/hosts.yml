# Fedora Lane — fictional inventory model (Core Pack)
# Demo mode: all groups resolve to localhost via local connection.
# Replace ansible_host / connection when mapping real estate.

all:
  children:
    na_dc:
      hosts:
        virginia-rhel-01:
          ansible_connection: local
          fl_site: virginia
          fl_role: dc_app
    emea_dc:
      hosts:
        frankfurt-rhel-01:
          ansible_connection: local
          fl_site: frankfurt
          fl_role: dc_app
    boutiques:
      hosts:
        paris-boutique-01:
          ansible_connection: local
          fl_site: paris
          fl_role: boutique
        tokyo-boutique-01:
          ansible_connection: local
          fl_site: tokyo
          fl_role: boutique
    cloud_linux:
      hosts:
        aws-ecom-linux-01:
          ansible_connection: local
          fl_site: aws-us-east-1
          fl_role: cloud_app
  vars:
    fl_org: Fedora Lane
    fl_pilot: platform-consistency
    # Demo-safe: skip OS-mutating tasks unless explicitly enabled
    fl_apply_host_changes: false
