# Fedora Lane — RHEL golden image blueprint (practice)
# Image Builder / osbuild-composer blueprint format
# Do NOT put activation keys or passwords here.

name = "fl-rhel-baseline"
description = "Fedora Lane pilot golden image: consistent RHEL baseline for DC, boutique, and cloud Linux hosts"
version = "0.0.1"
modules = []
groups = []

# Adjust distro to match your builder (examples: rhel-9, rhel-10)
distro = "rhel-9"

[[packages]]
name = "vim-enhanced"

[[packages]]
name = "curl"

[[packages]]
name = "jq"

[[packages]]
name = "chrony"

[[packages]]
name = "firewalld"

[[packages]]
name = "insights-client"

[[packages]]
name = "cockpit"

[[packages]]
name = "cockpit-system"

[[packages]]
name = "openssh-server"

[[packages]]
name = "python3"

[[packages]]
name = "podman"

[customizations]
hostname = "fl-rhel-baseline"

[customizations.timezone]
timezone = "UTC"
ntpservers = ["time.google.com", "time.cloudflare.com"]

[customizations.firewall]
ports = ["22:tcp", "8080:tcp"]

[customizations.services]
enabled = ["sshd", "chronyd", "firewalld", "insights-client.timer"]

[[customizations.sshkey]]
user = "fladmin"
# REPLACE with your public key before compose — never commit a private key
key = "ssh-ed25519 AAAAREPLACE_WITH_YOUR_PUBLIC_KEY fladmin@fedorlane-pilot"

[[customizations.user]]
name = "fladmin"
description = "Fedora Lane Linux baseline admin"
groups = ["wheel"]
# Password hashed offline; leave key-based for pilot preferrence
key = "ssh-ed25519 AAAAREPLACE_WITH_YOUR_PUBLIC_KEY fladmin@fedorlane-pilot"

[customizations.openscap]
# Optional: point to a tailored profile in a real lab
# profile_id = "xccdf_org.ssgproject.content_profile_cis_server_l1"
