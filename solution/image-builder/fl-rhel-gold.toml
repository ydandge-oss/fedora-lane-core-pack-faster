# Fedora Lane — Server/Cloud OS Expansion Pack
# RHEL Image Builder blueprint (local compose on a RHEL VM)
# Doc: https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/10/html/composing_a_customized_rhel_system_image/image-builder-description
#
# Generate compose-ready fl-rhel-gold.toml:
#   ./scripts/generate-blueprint.sh
#
# BEFORE COMPOSE: replace SSH public keys; optional password hashes for sudo demo.

name = "fl-rhel-gold"
description = "Fedora Lane e-commerce web gold image — Expansion Pack (RHEL Image Builder)"
version = "0.1.0"
modules = []
groups = []
distro = "rhel-10"

[customizations]
hostname = "fl-rhel-gold"
partitioning_mode = "lvm"

[[packages]]
name = "podman"

[[packages]]
name = "container-tools"

[[packages]]
name = "firewalld"

[[packages]]
name = "policycoreutils-python-utils"

[[packages]]
name = "setools-console"

[[packages]]
name = "sudo"

[[packages]]
name = "chrony"

[[packages]]
name = "curl"

[[packages]]
name = "jq"

[[packages]]
name = "vim-enhanced"

[[customizations.filesystem]]
mountpoint = "/"
minsize = "12 GiB"

[[customizations.filesystem]]
mountpoint = "/var/log"
minsize = "4 GiB"

[[customizations.filesystem]]
mountpoint = "/home"
minsize = "4 GiB"

[[customizations.filesystem]]
mountpoint = "/tmp"
minsize = "2 GiB"

[[customizations.filesystem]]
mountpoint = "/var/tmp"
minsize = "2 GiB"

[[customizations.group]]
name = "fladmins"

[[customizations.user]]
name = "fladmin1"
description = "Fedora Lane administrator 1"
groups = ["fladmins", "wheel"]
key = "ssh-ed25519 AAAAREPLACE_WITH_REAL_PUBLIC_KEY fladmin1@fedorlane-gold"
# Optional password hash for sudo demos (openssl passwd -6 'YourPassword'):
# password = "$6$rounds=5000$salt$hash"

[[customizations.user]]
name = "fladmin2"
description = "Fedora Lane administrator 2"
groups = ["fladmins", "wheel"]
key = "ssh-ed25519 AAAAREPLACE_WITH_REAL_PUBLIC_KEY fladmin2@fedorlane-gold"

[customizations.firewall]
ports = ["2222:tcp", "35443:tcp"]

[customizations.firewall.services]
disabled = ["ssh"]

[customizations.services]
enabled = ["sshd", "firewalld", "chronyd", "fl-gold-firstboot.service"]

[[customizations.directories]]
path = "/etc/ssh/sshd_config.d"
mode = "0755"

[[customizations.directories]]
path = "/etc/sudoers.d"
mode = "0750"

[[customizations.directories]]
path = "/etc/fl-gold"
mode = "0755"

[[customizations.directories]]
path = "/etc/fl-gold/bin"
mode = "0755"

[[customizations.directories]]
path = "/etc/systemd/system"
mode = "0755"

[[customizations.files]]
path = "/etc/ssh/sshd_config.d/00-fl-gold.conf"
mode = "0644"
data = """Port 2222
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
X11Forwarding no
AllowGroups fladmins
"""

[[customizations.files]]
path = "/etc/sudoers.d/fladmins"
mode = "0440"
data = """# Fedora Lane — sudo always requires password
Defaults:%fladmins timestamp_timeout=0
%fladmins ALL=(ALL) ALL
"""

[[customizations.files]]
path = "/etc/sudoers.d/wheel-password"
mode = "0440"
data = """%wheel ALL=(ALL) ALL
"""

[[customizations.files]]
path = "/etc/fl-gold/MARKER"
mode = "0644"
data = """Fedora Lane RHEL gold image (Image Builder)
SSH:2222 | httpd container:35443 | SELinux:enforcing
Built with local RHEL Image Builder — not hosted console.redhat.com
"""

[[customizations.files]]
path = "/etc/systemd/system/fl-gold-firstboot.service"
mode = "0644"
data = """[Unit]
Description=Fedora Lane gold image firstboot
After=network-online.target
Wants=network-online.target

[Service]
Type=oneshot
ExecStart=/etc/fl-gold/bin/fl-gold-firstboot.sh
RemainAfterExit=yes

[Install]
WantedBy=multi-user.target
"""

[[customizations.files]]
path = "/etc/fl-gold/bin/fl-gold-firstboot.sh"
mode = "0755"
data = """#!/bin/bash
# Fedora Lane — firstboot hardening for Image Builder gold image
# Baked into the image via blueprint [[customizations.files]]
set -euo pipefail

MARKER=/var/lib/fl-gold-firstboot-done
if [[ -f "$MARKER" ]]; then
  exit 0
fi

# SELinux enforcing
setenforce 1 || true
sed -i 's/^SELINUX=.*/SELINUX=enforcing/' /etc/selinux/config || true

# SELinux labels for Expansion Pack non-standard ports
if command -v semanage >/dev/null 2>&1; then
  semanage port -a -t ssh_port_t -p tcp 2222 2>/dev/null || semanage port -m -t ssh_port_t -p tcp 2222 || true
  semanage port -a -t http_port_t -p tcp 35443 2>/dev/null || semanage port -m -t http_port_t -p tcp 35443 || true
fi

# /tmp and /var/tmp noexec (blueprint minsize cannot set mount options)
if findmnt -n /tmp >/dev/null 2>&1; then
  mount -o remount,noexec,nodev,nosuid /tmp || true
  if grep -qE '[[:space:]]/tmp[[:space:]]' /etc/fstab; then
    awk '
      $2=="/tmp" && $4 !~ /noexec/ { $4="noexec,nodev,nosuid,"$4 }
      { print }
    ' /etc/fstab > /etc/fstab.fl && mv /etc/fstab.fl /etc/fstab
  fi
fi
if findmnt -n /var/tmp >/dev/null 2>&1; then
  mount -o remount,noexec,nodev,nosuid /var/tmp || true
fi

# Firewall: only 2222 + 35443
systemctl enable --now firewalld || true
firewall-cmd --permanent --remove-service=ssh || true
firewall-cmd --permanent --add-port=2222/tcp || true
firewall-cmd --permanent --add-port=35443/tcp || true
firewall-cmd --reload || true
systemctl enable --now sshd || true

# httpd in container on 35443
install -d -m 0755 /opt/fl/httpd-gold/html
cat >/opt/fl/httpd-gold/html/index.html <<'HTML'
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Fedora Lane Gold Image</title></head>
<body>
  <h1>Fedora Lane e-commerce web baseline</h1>
  <p>httpd is running from a container on the RHEL Image Builder gold image.</p>
  <p>Port 35443 · SSH 2222 · SELinux enforcing</p>
</body>
</html>
HTML

cat >/opt/fl/httpd-gold/Containerfile <<'CF'
FROM registry.access.redhat.com/ubi9/httpd-24
COPY html/ /var/www/html/
CF

if ! podman image exists localhost/fl-httpd-gold:latest; then
  (cd /opt/fl/httpd-gold && podman build -t localhost/fl-httpd-gold:latest .) || true
fi

podman rm -f fl-httpd 2>/dev/null || true
podman run -d --name fl-httpd --restart=always \
  -p 35443:8080 \
  -v /opt/fl/httpd-gold/html:/var/www/html:Z \
  localhost/fl-httpd-gold:latest || true

cd /tmp
podman generate systemd --new --name fl-httpd --files --restart-policy=always 2>/dev/null || true
if [[ -f /tmp/container-fl-httpd.service ]]; then
  install -m 0644 /tmp/container-fl-httpd.service /etc/systemd/system/fl-httpd.service
  systemctl daemon-reload
  systemctl enable --now fl-httpd.service || true
fi

touch "$MARKER"
echo "Fedora Lane gold firstboot complete"

"""
