#cloud-config
# Fedora Lane PoC — same day-0 baseline intent as Image Builder blueprint
# Applied to AWS EC2 and Azure VMs so hybrid clouds start consistent.

hostname: fl-rhel-baseline-poc
manage_etc_hosts: true
timezone: UTC

package_update: true
packages:
  - curl
  - jq
  - chrony
  - firewalld
  - python3
  - python3-pip
  - git
  # Present on full RHEL; ignore failures on some RHEL-compatible images via runcmd
  # insights-client / cockpit installed in runcmd when available

write_files:
  - path: /etc/fl-baseline/MARKER
    permissions: "0644"
    content: |
      Fedora Lane — RHEL baseline PoC marker
      Blueprint: fl-rhel-baseline
      Source: solution/image-builder/fl-rhel-baseline.toml
      Applied-via: cloud-init (AWS/Azure hybrid PoC)
  - path: /etc/fl-baseline/baseline.env
    permissions: "0644"
    content: |
      FL_OS=RHEL-or-compatible-9
      FL_NTP=chrony
      FL_FIREWALL=firewalld
      FL_INSIGHTS=installed_if_available
      FL_ADMIN_USER=fladmin
      FL_APP_RUNTIME=python3
  - path: /opt/fl/inventory-sync/requirements.txt
    permissions: "0644"
    content: |
      fastapi==0.115.6
      uvicorn[standard]==0.32.1
  - path: /opt/fl/inventory-sync/app/main.py
    permissions: "0644"
    content: |
      from __future__ import annotations
      import os
      from datetime import datetime, timezone
      from fastapi import FastAPI, Header, HTTPException

      app = FastAPI(title="Fedora Lane Boutique Inventory Sync", version="0.1.0")
      SYNC_API_TOKEN = os.getenv("SYNC_API_TOKEN", "demo-not-a-real-secret")
      FL_ENV = os.getenv("FL_ENV", "poc-cloud")
      SAP_SYSTEM = os.getenv("SAP_SYSTEM", "S4HANA-FL-NA")
      POS_REGION = os.getenv("POS_REGION", "multi")
      _STATE = {"last_sync_at": None, "last_status": "never_run", "boutiques_synced": ["paris", "london", "new_york", "tokyo"], "records_processed": 0}

      @app.get("/health")
      def health():
          return {"status": "ok", "service": "fl-boutique-inventory-sync", "env": FL_ENV, "timestamp": datetime.now(timezone.utc).isoformat()}

      @app.get("/api/v1/sync/status")
      def sync_status():
          return {"sap_system": SAP_SYSTEM, "pos_region": POS_REGION, "last_sync_at": _STATE["last_sync_at"], "last_status": _STATE["last_status"], "boutiques": _STATE["boutiques_synced"], "records_processed": _STATE["records_processed"], "notes": "Hybrid cloud PoC instance"}

      @app.post("/api/v1/sync/run")
      def run_sync(x_api_token: str | None = Header(default=None)):
          if x_api_token != SYNC_API_TOKEN:
              raise HTTPException(status_code=401, detail="Invalid or missing X-Api-Token")
          now = datetime.now(timezone.utc).isoformat()
          _STATE["last_sync_at"] = now
          _STATE["last_status"] = "success"
          _STATE["records_processed"] += 42
          return {"status": "success", "synced_at": now, "boutiques": _STATE["boutiques_synced"], "records_processed": 42, "message": "Simulated SAP → PoS inventory sync completed."}
  - path: /etc/systemd/system/fl-inventory-sync.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Fedora Lane Boutique Inventory Sync (PoC)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      WorkingDirectory=/opt/fl/inventory-sync
      Environment=FL_ENV=poc-cloud
      Environment=SYNC_API_TOKEN=demo-not-a-real-secret
      Environment=SAP_SYSTEM=S4HANA-FL-NA
      Environment=POS_REGION=multi
      ExecStart=/usr/local/bin/uvicorn app.main:app --host 0.0.0.0 --port 8080
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target

runcmd:
  - mkdir -p /opt/fl/inventory-sync/app /etc/fl-baseline
  - systemctl enable --now chronyd || systemctl enable --now chrony || true
  - systemctl enable --now firewalld || true
  - firewall-cmd --permanent --add-service=ssh || true
  - firewall-cmd --permanent --add-port=8080/tcp || true
  - firewall-cmd --reload || true
  - dnf install -y insights-client cockpit cockpit-system 2>/dev/null || yum install -y insights-client 2>/dev/null || true
  - pip3 install --prefix /usr/local -r /opt/fl/inventory-sync/requirements.txt
  - systemctl daemon-reload
  - systemctl enable --now fl-inventory-sync.service
  - echo "Fedora Lane hybrid baseline cloud-init complete" > /etc/motd

final_message: "Fedora Lane PoC baseline ready — inventory-sync on :8080"
